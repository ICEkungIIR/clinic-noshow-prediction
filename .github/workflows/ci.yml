name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q

  # TODO(ci workstream): add `data-validation` (Pandera on fixtures + bad_data.csv must fail)
  # TODO(ci workstream): add `model-gate` (evaluate candidate vs configs/slo.yaml gate)
