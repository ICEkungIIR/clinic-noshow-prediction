# One command: `make up`  (versions pinned to match uv.lock)
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: ["8000:8000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [mlflow]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts localhost,localhost:5001,127.0.0.1:5001,mlflow,mlflow:5000
    ports: ["5001:5000"]   # 5000 is taken by AirPlay on macOS
    volumes: [mlflow-data:/mlflow]

  prefect:
    image: prefecthq/prefect:3.8.7-python3.11
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    volumes: [prefect-data:/root/.prefect]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mlflow-data:
  prefect-data:
  grafana-data:
