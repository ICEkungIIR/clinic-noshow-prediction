# Single source of truth for pipeline parameters (logged to MLflow on every run)
seed: 42

data:
  # Kaggle: joniarroba/noshowappointments (110,527 appointments, Brazil, Apr-Jun 2016)
  kaggle_dataset: joniarroba/noshowappointments
  kaggle_file: KaggleV2-May-2016.csv
  sha256: "9132d3e7d0246617df9041d3764f20ad6f08e7b0d9f0997fa254fc5e52eda27d"  # data version v1
  raw_path: data/raw/noshow.csv
  processed_dir: data/processed

split:  # time-based split on AppointmentDay (no random split: avoids temporal leakage)
  train_end: "2016-05-20"   # TODO(data workstream): confirm after EDA
  val_end: "2016-05-31"
  group_col: PatientId      # check patient overlap across splits

target:
  column: No-show           # "Yes" = patient did NOT show up -> positive class 1
  positive_label: "Yes"

model:
  name: baseline_logreg
  params: {}

registry:
  model_name: clinic-noshow
